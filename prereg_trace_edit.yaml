# Pre-registration, trace cycle "trace-2026-11-25-edit": the same proof after editing. Written 2026-11-24T23:45Z
# BEFORE the edited repository was cloned, any cache fetched or any measure computed. Changes after this point go in
# an amendment at the end of this file, not in the body.
#
# Occasion. The prior trace (trace-2026-11-24-prior) found the archive's shape unlike any of a hundred large Mathlib
# proofs: a chain where Mathlib has fans. Three differences ride together in that comparison: who reasoned (a
# machine search under one person's direction, against many people), whether the artifact was edited (a raw record,
# by its author's own 23 November statement, against the most edited mathematical text there is), and what it is
# for (one argument toward one theorem, against library lemmas). Heidi Bennett asked for the control that holds the
# first and third fixed: the same proof, edited. One exists in progress. Since 20 November the Lean community has
# been cleaning the archive in github.com/leanprover-community/riemann-hypothesis, whose `original` branch mirrors
# the submission and whose `main` is 2,641 commits ahead of it after four days, under a comparator that checks on
# every merge that `Main` still proves the same five statements with the three standard axioms. This cycle measures
# the edited archive at one pinned commit with the instrument of the prior trace, unchanged, and puts the result
# beside the archive's own earlier row and the Mathlib distribution.
#
# Caveats stated before the data. (1) Four days of editing is partial; the repository's README says the goal is
# readability and modularity "while preserving the logic of the proof", so a null result says only that this much
# editing has not moved the shape. (2) The editing is done largely by AI agents under human maintainers: the
# repository carries an AGENTS.md addressed to agents, and the merges are batched by maintainers. "Edited" here means
# edited by the community's process, not by hand. (3) The compiled files are fetched from the community's cache, not
# compiled here (a full compile took 14 h 48 m and 100 GB in cycle 2 and the VM has 96 GB free); the walk reads the
# dependency graph from those files. Lake's `--no-build` check that they match the pinned source by trace hash, and a
# recompile of twenty random modules compared constant by constant, are the checks on that. This is a trace with no
# standing, and the comparator's own verification is the community's, not redone here. (4) Directory names changed in
# the edit (the root's `Development/…` tree remains; `BuildAid` and `Supplements` are gone from `src/`), so the
# directory measures are reported but not predicted.

