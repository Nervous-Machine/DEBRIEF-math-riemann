standing_consequences:
  all: "None. A trace changes no standing by construction, and this one measures an artifact that is not the claim's. Verdict confirmed when C1 to C5 are reported with every number; misses listed. Gap touched: EG3."
  fail: "If the cache cannot be fetched or does not pass --no-build, the walk is not run on it and the cycle records the halt; a compile from source needs disk the VM does not have and would be a new registration. A corrected script is an amendment here."

not_settled_by_this_cycle: >
  Whether editing can change the shape at all: this is one partial state of an ongoing edit, by agents under
  maintainers, and the registered predictions say the chain survives it. If they hold, the comparison of raw against
  edited is still open until the community's work is further along, and the right next cycle is this one again at a
  later commit under a new registration citing this one. If they miss, editing explains at least part of the
  difference from Mathlib, and the shape charts are about editing before they are about machines. Nothing about the
  third difference, one argument against library lemmas, which needs large single-purpose human Lean projects measured
  the same way. Nothing about why any proof has the shape it has.
