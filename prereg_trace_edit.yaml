  run_edit.sh: "sha256 966bdf3abea6a4d378f26fb598cb0285da00ac48b4c2cc49147d8066f3bbd8a4; clone at the pinned commit; original branch as a worktree; diff of original/src against the tarball's extracted src; Mathlib cache from cache.mathlib.org; the community's cache (killed if free disk falls under 10 GB); lake build --no-build; the walk; twenty random modules (seed 20261125) recompiled with lake env lean -o and compared with SpotCheck; edit.py; sha256 of outputs"
