extra_gaps:
  - title: "The Generalized Riemann Hypothesis statements are the claimant's own definitions, with no third-party formal statement to compare against"
    spoken: >-
      Four of the five results in Main.lean are stated with definitions the claimant wrote in Statements.lean, about
      zeros and non-vanishing of Dirichlet L-functions. Mathlib has no definition of the Generalized Riemann Hypothesis
      to compare them with, so whether these four definitions say what the Generalized Riemann Hypothesis says is
      entirely a human read.
    what: "two independent mathematicians read the four definitions in Statements.lean against the Generalized Riemann Hypothesis as usually stated and sign, or refuse"
    who: "an analytic number theorist, about an hour with the file"
    kind: read
    ask: "A reading of the four Dirichlet L-function definitions against the Generalized Riemann Hypothesis, by someone who did not write them."
    expected_signal: "two signed read cycles, or a refusal naming the difference"
