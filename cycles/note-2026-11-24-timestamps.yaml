  numbers:
    mtimes: "every one of the 175,190 entries carries the Unix epoch (1970-01-01T00:00:00Z) as its modification time"
    ownership: "every entry is owned by uid 0, gid 0, mode 0644"
    order: "the 175,187 .lean entries are in C-locale sorted order by path; no entry breaks the order"
    consequence: "the release was normalised in the manner of a reproducible build (fixed timestamp, fixed owner, sorted entries); no chronology of when any file was written survives in it; the only remaining sources of order are the names (rewrite marks, stage names) already measured, and the author's unpublished attempt record"
spoken: >
  A short check, filed because its answer closes a door. The release tarball of the proof carries no dates: every
  file is stamped with the Unix epoch, owned by nobody, and listed in alphabetical order. That is how a reproducible
  build is packaged, and it is good practice, but it also means that nothing in the release says what was written
  first and what last. The dependency tree can be measured; its history cannot. The one chronology that exists is
  the record of attempts, which has not been published.
