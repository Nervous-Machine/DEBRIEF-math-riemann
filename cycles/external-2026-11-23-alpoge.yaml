spoken: >
  Three days after the release the claimant posted a list of his own mistakes. The two hundred and fifty thousand
  pages were a joke that got away from him. He wrote no account he thought readable and put everything into Lean,
  which he calls full of garbage, though it compiles, and which he expects to shrink a great deal once someone does
  the work. He says criticism of it is fair. None of that touches the check: the theorem has the right type and the
  kernel accepts it, and that was never about tidiness. What it changes is how to read the size. The traces of the
  past two days found a third of the archive unused, rewriting concentrated at the joins, and a shape unlike any
  proof in Mathlib; the author now says, in effect, that this is what it is. And the document this record and
  others asked to see does not exist in the form everyone named. Whatever record of attempts does exist, in whatever
  size, is the ask now. A reaction the same evening called the release a stunt and tied it to the timing of Masullo's
  draft; that is one person's account of motives, and this record keeps to what the documents say.
