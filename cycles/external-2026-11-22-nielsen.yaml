          note: >-
            A reading of the formal term by a named person, the first on the public record to dispute the claim. Its
            factual reports about the source are not checked here. Its conclusion does not follow from them as stated.
            A closed term of Mathlib's RiemannHypothesis, accepted by the kernel with only propext, Classical.choice
            and Quot.sound, is a proof of that proposition whatever the names of the intermediate hypotheses say: a
            hypothesis slot defined as True removes an assumption and weakens nothing downstream; an equation proved
            by rfl is an equation; and RiemannHypothesis is a statement about the zeros of zeta, not a proposition
            that is definitionally True, so no term of that type is the identity "RH = RH". The paper names no error
            in the statement, the pins or the kernels, and gives no mechanism by which the type could be inhabited
            without the proposition holding. What it does report, if its citations are right, is that the formal
            route does not use the geometric content the archive's names advertise. Jaswal's guide, read the same day,
            notes the same True-valued slots (hypotheses of TopShapeAlt set to True; a bundle field of type
            UnusedSlot72, which is True) and treats them as unused inputs. That is a finding about what the proof
            actually does and how it can be read, which bears on the reading gap and not on the machine check. The
            offered dependency walk would confirm which constants the term uses, not whether the proof holds, and is
            not run here. Standing unchanged.
