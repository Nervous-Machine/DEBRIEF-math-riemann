spoken: >
  The first document to dispute the claim, with a name on it. J. L. Nielsen, a physicist and philosopher of science in
  Kansas, posted a seventeen-page paper to PhilPapers on 20 November and revised it through the 22nd. She accepts that
  the top-level theorem is Mathlib's statement of the Riemann Hypothesis and that the source has no axioms or holes,
  and she reports, from reading about seventy files along the proof's route, that the geometric layer the archive's
  names advertise is empty: a predicate defined as True, equalities that hold by definition because one side is a copy
  of the other, a height set to its own formula. From this she concludes the archive proves only that the Riemann
  Hypothesis equals itself. That conclusion does not follow. A term the kernel accepts, of a type that is Mathlib's
  statement about the zeros of zeta, proves that statement no matter what the intermediate names say; an assumption
  set to True is an assumption removed, not a flaw introduced. What her reading may show, if her citations hold, is
  that the proof does not do what its names say it does. That matters for anyone trying to read it, and it is the
  kind of thing the reading gap is for. It moves nothing in the machine check. Read beside it, the same day: a 54-page
  reader's guide by Manvir Jaswal that lays out the route in ordinary notation, labelled by its venue as primarily
  AI-written with no part understood by a person.
