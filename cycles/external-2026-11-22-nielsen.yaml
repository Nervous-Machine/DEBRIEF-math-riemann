            its defining equation proved by rfl, that the map from lattices to sections is the zero map, and that the
            lemmas written to extract geometric content are never called. From this she argues that the inequality
            meant to trap an independent geometric height compares a quantity with itself, so that the term certifies
            only "RiemannHypothesis = RiemannHypothesis". An appendix states the kernel objection and answers that no
            independent algebraic route remains once the vacuous package is removed. Offers one check, a
            transitivelyUsedConstants walk from riemannHypothesis, which would list the constants the term uses.
