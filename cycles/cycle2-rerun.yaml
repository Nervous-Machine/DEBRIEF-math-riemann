spoken: >
  The resumed build finished: all hundred and seventy-five thousand modules compile from the pinned archive on our
  machine, with no error, in fourteen hours and forty-eight minutes and sixty-one gigabytes of memory. The source has no
  sorry, admit, axiom or escape hatch. Each of the five entry theorems rests on exactly Lean's three standard axioms.
  The main theorem's statement is Mathlib's own definition of the Riemann Hypothesis, declared once, in Mathlib, and
  nowhere redefined. Compared with Andrew Sutherland's build at MIT, our output is byte-identical on 76,968 files,
  including the entry file, and differs on 98,219, every one of which carries our source path inside a stored warning
  and none of which is among the equal files; his own count of his build is the same split. So the build is reproduced,
  the standing is accepted, and the certification rule still waits on a comparison that does not depend on where the
  build ran.
