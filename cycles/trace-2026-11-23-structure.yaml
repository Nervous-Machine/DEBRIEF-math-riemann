spoken: >
  On 23 November Nervous Machine walked the dependency graph of the proof from its main theorem down, to measure
  what Yochay Jerby had described in words that morning. The top of the proof is exactly as he said: everything in
  the archive, one million two hundred sixty-five thousand constants and ten and a half million lines, goes into one
  theorem, that no Dirichlet L-function vanishes to the right of the critical line, and sixty-four lines of
  functional-equation argument then put the zeros on the line. Below that theorem there is no second bottleneck:
  the mass divides at every step, and the heaviest lemmas carry the names of the theta correspondence, Galois
  representations, and Arakelov-style volume bounds, not of sums over primes. The proof term reaches eighty-six
  percent of the archive's lines and all seven of its largest subject directories; twenty-three small directories,
  eight thousand lines in all, are never used. The statements of the twenty heaviest lemmas are printed verbatim for
  anyone who wants to read them. Four of six predictions registered before the walk missed, each because the proof
  uses more of the archive, and more of Mathlib, than the operating agent expected. Nothing changed standing.
