spoken: >
  On 24 November Nervous Machine put the proof beside three thousand Mathlib proofs, measured the same way. A large
  Mathlib proof is a fan: its mass meets at the theorem itself, four fifths of it, and the spine is down to a tenth
  by the third step. The archive is a chain: it holds everything for three steps and two thirds at the fifth, and
  its largest joint gathers a quarter. It has twice the hinges and they are half the length, four lines against ten,
  shorter than in any of the hundred Mathlib proofs; thirty-two of them carry a rewrite mark where Mathlib's carry
  none, and its rate of rewrite marks is thirty-eight times Mathlib's. One subject directory holds forty-four percent
  of its lines against a Mathlib sixteen. What it shares with Mathlib is substrate: in both, the largest directory is
  reached from everywhere and dominated by nothing in itself, which the operating agent had taken for a peculiarity
  and registered as one; that prediction missed. Five of seven held. The ten largest Mathlib proofs in the sample are
  all about L-functions, number fields and modular forms, the ground the archive stands on. Nothing changed standing.
