spoken: >
  On 25 November Nervous Machine measured the same proof after four days of the Lean community's cleanup, 2,641
  commits by agents under maintainers, at a pinned commit whose compiled files the community supplied and Lake
  checked against the source. A quarter of the archive is gone and two thirds of its files have been merged. The proof
  below the theorem is six percent smaller, and its shape is the shape it had. Read by step the spine looks shorter,
  because two wrapper theorems at the top were deleted; read by constant, every step carries the share it carried a
  week earlier, the same joint gathers the same quarter, and sixty-one of the eighty-one hinges are the same hinges
  with the same lengths. The ones that left were the short wrappers and the retry variants, which is the whole of the
  movement toward Mathlib in the table. Five of nine registered predictions held; two of the misses were predictions
  written against step indices that wrapper removal shifts, and the record says so. Editing, so far, explains none of
  the chain. Nothing changed standing.
