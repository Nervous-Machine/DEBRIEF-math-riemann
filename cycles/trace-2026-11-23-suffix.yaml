spoken: >
  On 23 November Nervous Machine counted the fossils of rewriting in the names of the proof. They are rare in the
  body, fifteen in a thousand named constants, fewer than Mathlib's own habit of primed names, and three thousand
  constants end in _alt against four in all of Mathlib. They are dense at the joins: thirty-three of the eighty-one
  constants that each carry at least one percent of the proof have a retry mark, and fifty-seven percent of the
  proof's lines sit under one. The theorem that assembles the published inputs was written at least six times, and
  two versions are still in use. When a lemma was rewritten and both versions kept, both are still used a little
  under half the time. The proof uses two thirds of the archive's constants; a third was written and never used. The
  operating agent expected the body to be far more retry-marked than it is: three of six predictions missed, one of
  them because the registered name dump ran at ninety constants a second and had to be replaced. Nothing changed standing.
