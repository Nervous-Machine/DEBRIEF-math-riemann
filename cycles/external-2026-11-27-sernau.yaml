spoken: >
  On 25 November Luke Sernau, with colleagues at Anthropic and Claude, posted a second Lean development of the same
  five theorems: a rewriting of the original in about 76,000 lines of code instead of 15.5 million, with a readable
  version of about 300,000. Andrew Sutherland checked both versions inside a sandbox with every kernel Lean ships, on
  two machines for the compact one, and Michael Rubinstein checked the compact one again at Waterloo. They agree: the
  same statements, Lean's three standard axioms, every kernel accepting. It is a new artifact of the same claim, not
  the archive this record pinned, and no mathematician has yet reported reading it.
