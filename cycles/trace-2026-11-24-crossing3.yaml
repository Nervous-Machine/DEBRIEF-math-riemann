spoken: >
  On 24 November Nervous Machine ran the crossing test again one directory level down, at five hundred and ninety
  bins. The test came unstuck and then failed the other way: sixteen of the proof's twenty joints now bring together
  directories their wings do not share, and so do a quarter of Mathlib's own large joints, but every such pair, on
  both sides, is one that no Mathlib theorem has ever depended on together, so the rarity score is zero for everyone
  and tells nothing apart. The pairs are library corners, free algebras and box integrals and Dold–Kan, pulled in by
  big cones from different directions, not junctions of ideas. No choice of directory depth measures whether the
  ideas joined had met before; that needs the published theorems each wing rests on, which is a reading with a
  bibliography. What both depths agree on is that the proof's wings draw on nearly the same library where Mathlib's
  do not, the mark of stages on one route rather than inputs to a fan. Six predictions held, two of them hollow and
  marked so. Nothing changed standing.
