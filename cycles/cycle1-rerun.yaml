spoken: >
  Our first build of the archive ran for three hours and nineteen minutes and stopped when the machine's disk filled.
  The disk was our mistake: the build tool writes a large bookkeeping file for every module, and we had not planned for
  it. Thirty-two thousand of the hundred and seventy-five thousand modules compiled before the halt, with no error
  other than the full disk. We compared those with the hashes Andrew Sutherland published: about half agree byte for
  byte. The other half differ because the compiler writes the absolute path of each source file into the output of any
  module that produced a warning, so two builds in different directories cannot match on those modules. The build is
  resumed as cycle 2, written down first.
