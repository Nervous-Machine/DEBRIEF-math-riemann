spoken: >
  On 24 November Nervous Machine tried the general-relativity test on the proof: do the wings that meet at a joint
  come from different parts of the library, and had those parts been joined before? At the resolution of Mathlib's
  directory tree the test has nothing to say. The proof reaches twenty-five of twenty-six directories and every wing
  of every large joint reaches nearly all of them, so no joint brings together anything its wings did not already
  share; Mathlib's own large proofs behave the same way, four in a hundred showing any crossing at all. Two things
  survive: the archive's wings are more alike than Mathlib's, which fits a chain of stages rather than a fan of
  inputs, and the archive uses almost all of Mathlib where no sampled Mathlib proof uses more than twenty of its
  directories. The finer instrument is a new registration. Five of six predictions held, one of them hollow and
  marked so. Nothing changed standing.
