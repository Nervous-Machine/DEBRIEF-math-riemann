spoken: >
  Andrew Sutherland rebuilt the archive a second time, on another machine, inside a sandbox, with lake, at the same
  directory as before. The exported proof came out byte for byte the same as the one every kernel had checked. The
  compiled files matched his first build on all but one, and that one is not the path problem: it is a module Lean
  compiles two different ways at random, differing in a variable's name that the kernel never looks at. So even a
  shared path does not give a full manifest match, and the export does. Recorded as what the page says; it bears on the
  decision open in EG5 and moves nothing by itself.
