spoken: >
  On 23 November Nervous Machine looked below the two-percent line of the morning's structure trace for a closet: a
  small lemma in a small place that the proof hangs on. There is none. Eighty-one constants each carry at least one
  percent of the proof, every one of them in one of the ten large subject directories, and every one of them short,
  four lines in the middle, eighty-eight at most. The hinges are glue, and the mass sits below them. Three short
  theorems each join more than a fifth of the proof: a four-line theorem with fifty thousand direct dependants, a
  two-line one with fifty-eight thousand, a twenty-five-line one with forty-eight thousand. Those are the places where
  the wings meet, and their statements were printed in the morning. The spine runs through the automorphic directory
  to under two percent, crosses into abelian-variety theory, and ends in lattice point counts. The abelian-variety
  theory, nearly half the archive, is reached from many directions and dominated by nothing in itself. Five of six
  predictions held; the spine left the automorphic directory a little earlier than predicted. Nothing changed standing.
