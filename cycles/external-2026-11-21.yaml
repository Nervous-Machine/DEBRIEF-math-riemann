spoken: >
  What the public record added on 21 November. The Lean and Mathlib communities published a joint statement, which the
  page says is endorsed by the Lean FRO and the Mathlib Initiative, saying they certify both the statement and the
  proof of the Riemann Hypothesis: dozens of independent compilations reproducing the same exported proof, two tools
  confirming the proved theorem is Mathlib's statement, and several checkers accepting the export. It names no
  individual, does not mention the four Dirichlet L-function statements, and says the mathematical community's work of
  explaining the ideas lies ahead. Andrew Sutherland's page added a second independent kernel accepting the export,
  lean4lean passing every module, the five statements in words with their scope, two arithmetic consequences derived
  with an independent formalization, and the one thing this record had asked him for: his build path, with his own
  count of how many compiled files embed it. None of this is a cycle under its author's name here; it is what the
  record saw.
